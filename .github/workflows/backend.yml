name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Containerized format, vet, race, contract and PostgreSQL integration checks
        run: make docker-test
      - name: Build non-root production image
        run: docker build --target runtime --build-arg REVISION=${{ github.sha }} -t portway:ci .
      - name: Production image process smoke
        run: make docker-smoke
