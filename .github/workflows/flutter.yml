name: Flutter Android
on:
  push:
    paths: ['apps/portway/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['apps/portway/**', '.github/workflows/flutter.yml']
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: portway-debug-apk
          path: apps/portway/build/app/outputs/flutter-apk/app-debug.apk
